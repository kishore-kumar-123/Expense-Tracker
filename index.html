<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <!-- 1. Add Expense Form -->
        <h2>Add Expense</h2>
        <form action="/add-expense" method="POST">
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" placeholder="e.g. Food, Rent, Salary" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount (₹):</label>
                <input type="number" step="0.01" id="amount" name="amount" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" placeholder="Optional description">
            </div>
            <button type="submit">Add Expense</button>
        </form>

        <!-- 2. Monthly Expense Summary -->
        <h2>Monthly Expense Summary</h2>
        <form action="/" method="GET" style="margin-bottom: 10px;">
            <div class="form-group">
                <label for="month">Select Month:</label>
                <select id="month" name="month">
                    <option value="1" {{MONTH_1}}>January (1)</option>
                    <option value="2" {{MONTH_2}}>February (2)</option>
                    <option value="3" {{MONTH_3}}>March (3)</option>
                    <option value="4" {{MONTH_4}}>April (4)</option>
                    <option value="5" {{MONTH_5}}>May (5)</option>
                    <option value="6" {{MONTH_6}}>June (6)</option>
                    <option value="7" {{MONTH_7}}>July (7)</option>
                    <option value="8" {{MONTH_8}}>August (8)</option>
                    <option value="9" {{MONTH_9}}>September (9)</option>
                    <option value="10" {{MONTH_10}}>October (10)</option>
                    <option value="11" {{MONTH_11}}>November (11)</option>
                    <option value="12" {{MONTH_12}}>December (12)</option>
                </select>
                <button type="submit">View Summary</button>
            </div>
        </form>

        <div class="summary-box">
            Total Expense for Month {{SELECTED_MONTH_NUMBER}}: <strong>₹{{MONTHLY_TOTAL}}</strong>
        </div>

        <!-- 3. Category-wise Summary Table -->
        <h2>Category-wise Summary</h2>
        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Total Amount (₹)</th>
                </tr>
            </thead>
            <tbody>
                {{CATEGORY_SUMMARY_ROWS}}
            </tbody>
        </table>

        <!-- 4. All Expenses Table -->
        <h2>All Expenses</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Amount (₹)</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {{ALL_EXPENSES_ROWS}}
            </tbody>
        </table>
    </div>

    <!-- Small script to default date input to today's date -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('date');
            if (dateInput && !dateInput.value) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }
        });
    </script>
</body>
</html>
